name: Algorithm Grader

on:
  push:
    branches: [main]
    paths:
      - '**/src/main/*.java'
  pull_request:
    paths:
      - '**/src/main/*.java'

jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai pyyaml requests

      - name: Grade algorithm submissions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python .github/scripts/grade_code.py

      - name: Send Kakao notification
        if: always()
        env:
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_REFRESH_TOKENS: ${{ secrets.KAKAO_REFRESH_TOKENS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -f grade_kakao_msg.txt ]; then
            LINK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            python .github/scripts/kakao_notify.py grade_kakao_msg.txt "$LINK"
          fi

      - name: Post grade report to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = fs.readFileSync('grade_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (e) {
              console.log('grade_report.md not found, skipping comment');
            }
